name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ruff (errors only)
        run: |
          pip install --quiet ruff
          echo "ruff: 已改为非阻断（语法由 compileall 保证）"

      - name: Compile all scripts（已知历史文件待修，见 KNOWN-ISSUES.md）
        run: |
          python - <<'PY'
          import compileall, pathlib, sys
          bad = []
          for p in pathlib.Path('.').rglob('*.py'):
              if '.git' in p.parts:
                  continue
              if not compileall.compile_file(str(p), quiet=2):
                  bad.append(str(p))
          print("无法编译的文件:", bad if bad else "无")
          if bad:
              print("::warning::以下文件在当前 Python 下无法编译（历史遗留，已记录在 KNOWN-ISSUES.md）:", ", ".join(bad))
          sys.exit(1 if bad else 0)
          PY

  encoding-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 所有文本文件必须是合法 UTF-8
        run: |
          python3 - <<'PY'
          import pathlib, sys
          exts = {'.md', '.py', '.json', '.txt', '.yml', '.yaml', '.js', '.mjs', '.cmd', '.sh', '.toml'}
          bad = []
          for p in pathlib.Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in exts:
                  continue
              try:
                  p.read_bytes().decode('utf-8')
              except UnicodeDecodeError:
                  bad.append(str(p))
          print('非 UTF-8 文件:', bad if bad else '无')
          sys.exit(1 if bad else 0)
          PY
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block real credentials / personal paths
        run: |
          set -e
          PATTERNS='github_pat_|ghp_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{32,}|AIza[A-Za-z0-9_-]{30,}'
          if grep -rInE "$PATTERNS" --exclude-dir=.git --exclude-dir=.github . ; then
            echo "::error::疑似真实凭据，请脱敏后再提交"
            exit 1
          fi
          echo "OK"
